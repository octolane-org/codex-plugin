name: Package checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 scripts/validate_schemas.py
      - run: python3 scripts/package_plugin.py validate
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/package_plugin.py build --draft
      - run: python3 scripts/validate_schemas.py --zip dist/octolane-ai-crm-0.2.0-draft.zip
